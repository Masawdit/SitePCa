<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Form Builder</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1 class="auth-title">Form Builder</h1>
            <p class="auth-subtitle" id="authSubtitle">Sign in to manage your forms</p>

            <!-- Error message -->
            <div id="errorMessage" class="form-error text-center mb-2" style="display: none;"></div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-input" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;" id="loginBtn">
                    Sign In
                </button>
            </form>

            <!-- Register Form (hidden by default) -->
            <form id="registerForm" style="display: none;">
                <div class="form-group">
                    <label class="form-label" for="regDisplayName">Display Name</label>
                    <input type="text" id="regDisplayName" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="regEmail">Email</label>
                    <input type="email" id="regEmail" class="form-input" required autocomplete="email" readonly>
                </div>

                <div class="form-group">
                    <label class="form-label" for="regPassword">Password</label>
                    <input type="password" id="regPassword" class="form-input" required minlength="6" autocomplete="new-password">
                    <p class="form-hint">At least 6 characters</p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="regPasswordConfirm">Confirm Password</label>
                    <input type="password" id="regPasswordConfirm" class="form-input" required minlength="6" autocomplete="new-password">
                </div>

                <input type="hidden" id="inviteToken">

                <button type="submit" class="btn btn-primary" style="width: 100%;" id="registerBtn">
                    Create Account
                </button>
            </form>

            <div class="mt-3 text-center">
                <a href="index.html">← Back to forms</a>
            </div>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>

    <script>
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const errorMessage = document.getElementById('errorMessage');
        const authSubtitle = document.getElementById('authSubtitle');

        // Check for invite token in URL
        const inviteToken = Utils.getUrlParam('invite');
        const errorParam = Utils.getUrlParam('error');

        // Show error from URL params
        if (errorParam === 'not_admin') {
            showError('You are not authorized as an admin');
        }

        // Initialize
        async function init() {
            // Check if user is already logged in
            const user = await Auth.getUser();
            if (user) {
                // Verify admin status
                const { data: admin } = await db
                    .from('admins')
                    .select('*')
                    .eq('id', user.id)
                    .single();

                if (admin) {
                    window.location.href = 'admin/dashboard.html';
                    return;
                }
            }

            // If invite token present, show register form
            if (inviteToken) {
                const invite = await Auth.validateInviteToken(inviteToken);
                if (invite) {
                    showRegisterForm(invite);
                } else {
                    showError('This invitation link is invalid or has expired');
                }
            }
        }

        function showRegisterForm(invite) {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
            authSubtitle.textContent = 'Create your admin account';

            document.getElementById('regEmail').value = invite.email;
            document.getElementById('inviteToken').value = inviteToken;
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        // Login form submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            Utils.setButtonLoading(loginBtn, true);

            try {
                await Auth.login(email, password);
                window.location.href = 'admin/dashboard.html';
            } catch (err) {
                showError(err.message);
            } finally {
                Utils.setButtonLoading(loginBtn, false);
            }
        });

        // Register form submission
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const displayName = document.getElementById('regDisplayName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const passwordConfirm = document.getElementById('regPasswordConfirm').value;
            const token = document.getElementById('inviteToken').value;
            const registerBtn = document.getElementById('registerBtn');

            // Validate passwords match
            if (password !== passwordConfirm) {
                showError('Passwords do not match');
                return;
            }

            Utils.setButtonLoading(registerBtn, true);

            try {
                await Auth.register(email, password, displayName, token);
                Utils.showToast('Account created! Please check your email to confirm.', 'success');

                // Try to log in automatically
                setTimeout(async () => {
                    try {
                        await Auth.login(email, password);
                        window.location.href = 'admin/dashboard.html';
                    } catch {
                        // If auto-login fails, show login form
                        window.location.href = 'login.html';
                    }
                }, 1500);
            } catch (err) {
                showError(err.message);
                Utils.setButtonLoading(registerBtn, false);
            }
        });

        // Initialize on load
        init();
    </script>
</body>
</html>
