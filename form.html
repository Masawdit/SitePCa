<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form - Form Builder</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <a href="index.html" class="header-logo">Form Builder</a>
            <nav class="header-nav">
                <a href="index.html">All Forms</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <div class="page-wrapper">
        <div class="container form-container">
            <!-- Loading state -->
            <div id="loadingState" class="text-center">
                <div class="spinner" style="margin: 2rem auto;"></div>
                <p class="text-muted">Loading form...</p>
            </div>

            <!-- Error state -->
            <div id="errorState" class="card empty-state" style="display: none;">
                <div class="empty-state-icon">❌</div>
                <h3>Form not found</h3>
                <p class="text-muted">This form doesn't exist or is no longer available.</p>
                <a href="index.html" class="btn btn-primary mt-2">View All Forms</a>
            </div>

            <!-- Form content -->
            <div id="formContent" style="display: none;">
                <div class="form-header">
                    <h1 class="form-title" id="formTitle"></h1>
                    <p class="form-description" id="formDescription"></p>
                </div>

                <form id="dynamicForm">
                    <div id="fieldsContainer"></div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">Submit</button>
                    </div>
                </form>
            </div>

            <!-- Success state -->
            <div id="successState" class="card form-success" style="display: none;">
                <div class="form-success-icon">✅</div>
                <h2>Thank you!</h2>
                <p>Your response has been recorded.</p>

                <h3 class="mt-3 mb-2">Export your response</h3>
                <div class="export-options">
                    <button class="btn btn-primary" id="downloadCsvBtn">Download CSV</button>
                    <button class="btn btn-secondary" id="emailCsvBtn">Send via Email</button>
                </div>

                <div class="mt-3">
                    <a href="index.html" class="btn btn-outline">Back to Forms</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/forms.js"></script>
    <script src="js/export.js"></script>

    <script>
        let currentForm = null;
        let currentFields = [];
        let submittedData = null;

        // Initialize
        async function init() {
            const formId = Utils.getUrlParam('id');

            if (!formId) {
                showError();
                return;
            }

            try {
                const { form, fields } = await Forms.loadForm(formId);

                if (!form || !form.is_published) {
                    showError();
                    return;
                }

                currentForm = form;
                currentFields = fields;

                document.title = `${form.title} - Form Builder`;
                renderForm();
            } catch (err) {
                console.error('Error loading form:', err);
                showError();
            }
        }

        function showError() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
        }

        function renderForm() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('formContent').style.display = 'block';

            document.getElementById('formTitle').textContent = currentForm.title;
            document.getElementById('formDescription').textContent = currentForm.description || '';

            const fieldsContainer = document.getElementById('fieldsContainer');
            fieldsContainer.innerHTML = currentFields.map(field => FieldRenderers.render(field)).join('');

            // Attach image preview handlers for multiple choice
            attachImagePreviewHandlers();
        }

        // Handle image preview when selecting multiple choice options
        function attachImagePreviewHandlers() {
            document.querySelectorAll('.field-multiple-choice input[type="radio"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    const field = this.closest('.form-field');
                    const preview = field.querySelector('.selected-image-preview');
                    const imageUrl = this.dataset.image;

                    if (imageUrl) {
                        preview.innerHTML = `<img src="${imageUrl}" alt="Selected option preview">`;
                        preview.classList.add('active');
                    } else {
                        preview.innerHTML = '';
                        preview.classList.remove('active');
                    }
                });
            });
        }

        // Form submission
        document.getElementById('dynamicForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            Utils.setButtonLoading(submitBtn, true);

            try {
                // Collect form data
                const formData = new FormData(e.target);
                const responseData = {};

                currentFields.forEach(field => {
                    if (field.field_type === 'checkbox') {
                        // Handle multiple checkboxes
                        const values = formData.getAll(field.code);
                        responseData[field.code] = {
                            label: field.label,
                            value: values,
                            type: field.field_type
                        };
                    } else if (field.field_type === 'file') {
                        // Handle file (just store filename)
                        const file = formData.get(field.code);
                        responseData[field.code] = {
                            label: field.label,
                            value: file ? file.name : '',
                            type: field.field_type
                        };
                    } else {
                        responseData[field.code] = {
                            label: field.label,
                            value: formData.get(field.code) || '',
                            type: field.field_type
                        };
                    }
                });

                // Save to database
                await Forms.submitResponse(currentForm.id, responseData);

                // Store for export
                submittedData = responseData;

                // Show success
                document.getElementById('formContent').style.display = 'none';
                document.getElementById('successState').style.display = 'block';

            } catch (err) {
                console.error('Error submitting form:', err);
                Utils.showToast('Error submitting form. Please try again.', 'error');
            } finally {
                Utils.setButtonLoading(submitBtn, false);
            }
        });

        // Export handlers
        document.getElementById('downloadCsvBtn').addEventListener('click', () => {
            if (submittedData) {
                const csv = Export.generateCSV(submittedData, currentFields);
                Export.downloadCSV(csv, `${currentForm.title.replace(/[^a-z0-9]/gi, '_')}_response.csv`);
            }
        });

        document.getElementById('emailCsvBtn').addEventListener('click', () => {
            if (submittedData) {
                const csv = Export.generateCSV(submittedData, currentFields);
                Export.mailtoCSV(csv, currentForm.title);
            }
        });

        // Initialize
        init();
    </script>
</body>
</html>
