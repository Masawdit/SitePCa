<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire - Créateur de Formulaires</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <a href="index.html" class="header-logo">
                <img src="Logo.png" alt="Logo">
                <span class="header-logo-text">FormBuilder</span>
            </a>
            <nav class="header-nav">
                <a href="index.html">Tous les formulaires</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <div class="page-wrapper">
        <div class="container form-container">
            <!-- Loading state -->
            <div id="loadingState" class="text-center">
                <div class="spinner" style="margin: 2rem auto;"></div>
                <p class="text-muted">Chargement du formulaire...</p>
            </div>

            <!-- Error state -->
            <div id="errorState" class="card empty-state" style="display: none;">
                <div class="empty-state-icon">❌</div>
                <h3>Formulaire introuvable</h3>
                <p class="text-muted">Ce formulaire n'existe pas ou n'est plus disponible.</p>
                <a href="index.html" class="btn btn-primary mt-2">Voir tous les formulaires</a>
            </div>

            <!-- Form content -->
            <div id="formContent" style="display: none;">
                <div class="form-header">
                    <h1 class="form-title" id="formTitle"></h1>
                    <p class="form-description" id="formDescription"></p>
                </div>

                <form id="dynamicForm">
                    <div id="fieldsContainer"></div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">Soumettre</button>
                    </div>
                </form>
            </div>

            <!-- Success state -->
            <div id="successState" class="card form-success" style="display: none;">
                <div class="form-success-icon">✅</div>
                <h2>Merci !</h2>
                <p>Votre réponse a été enregistrée.</p>

                <h3 class="mt-3 mb-2">Exporter votre réponse</h3>
                <div class="export-options">
                    <button class="btn btn-primary" id="downloadPdfBtn">Télécharger PDF</button>
                    <button class="btn btn-secondary" id="downloadCsvBtn">Télécharger CSV</button>
                    <button class="btn btn-secondary" id="emailCsvBtn">Envoyer par Email</button>
                </div>

                <div class="mt-3">
                    <a href="index.html" class="btn btn-outline">Retour aux formulaires</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- jsPDF for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/forms.js"></script>
    <script src="js/export.js"></script>
    <script src="js/pdf-export.js"></script>

    <script>
        let currentForm = null;
        let currentFields = [];
        let submittedData = null;

        // Initialize
        async function init() {
            const formId = Utils.getUrlParam('id');

            if (!formId) {
                showError();
                return;
            }

            try {
                const { form, fields } = await Forms.loadForm(formId);

                if (!form || !form.is_published) {
                    showError();
                    return;
                }

                currentForm = form;
                currentFields = fields;

                document.title = `${form.title} - Créateur de Formulaires`;
                renderForm();
            } catch (err) {
                console.error('Error loading form:', err);
                showError();
            }
        }

        function showError() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
        }

        function renderForm() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('formContent').style.display = 'block';

            document.getElementById('formTitle').textContent = currentForm.title;
            document.getElementById('formDescription').textContent = currentForm.description || '';

            const fieldsContainer = document.getElementById('fieldsContainer');
            fieldsContainer.innerHTML = currentFields.map(field => FieldRenderers.render(field)).join('');

            // Attach image preview handlers for multiple choice
            attachImagePreviewHandlers();
        }

        // Handle image preview and text input visibility when selecting options
        function attachImagePreviewHandlers() {
            // Multiple choice (radio buttons) - single image + text input
            document.querySelectorAll('.field-multiple-choice input[type="radio"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    const field = this.closest('.form-field');
                    const preview = field.querySelector('.selected-image-preview');
                    const imageUrl = this.dataset.image;

                    // Handle image preview
                    if (imageUrl) {
                        preview.innerHTML = `<img src="${imageUrl}" alt="Aperçu de l'option sélectionnée">`;
                        preview.classList.add('active');
                    } else {
                        preview.innerHTML = '';
                        preview.classList.remove('active');
                    }

                    // Handle text input visibility - hide all, show selected if it has text input
                    field.querySelectorAll('.choice-additional-input').forEach(input => {
                        input.style.display = 'none';
                        input.value = '';
                    });
                    if (this.dataset.hasTextInput) {
                        const textInput = this.closest('.choice-option').querySelector('.choice-additional-input');
                        if (textInput) {
                            textInput.style.display = 'block';
                        }
                    }
                });
            });

            // Checkboxes - multiple images possible + text inputs
            document.querySelectorAll('.field-checkbox input[type="checkbox"]').forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    const field = this.closest('.form-field');
                    const preview = field.querySelector('.selected-image-preview');

                    // Collect all checked checkboxes with images
                    const checkedWithImages = field.querySelectorAll('input[type="checkbox"]:checked[data-image]');

                    if (checkedWithImages.length > 0) {
                        preview.innerHTML = Array.from(checkedWithImages).map(cb =>
                            `<img src="${cb.dataset.image}" alt="Aperçu de l'option sélectionnée">`
                        ).join('');
                        preview.classList.add('active');
                    } else {
                        preview.innerHTML = '';
                        preview.classList.remove('active');
                    }

                    // Handle text input visibility for this checkbox
                    if (this.dataset.hasTextInput) {
                        const textInput = this.closest('.choice-option').querySelector('.choice-additional-input');
                        if (textInput) {
                            textInput.style.display = this.checked ? 'block' : 'none';
                            if (!this.checked) textInput.value = '';
                        }
                    }
                });
            });
        }

        // Form submission
        document.getElementById('dynamicForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            Utils.setButtonLoading(submitBtn, true);

            try {
                // Collect form data
                const formData = new FormData(e.target);
                const responseData = {};

                currentFields.forEach(field => {
                    if (field.field_type === 'checkbox') {
                        // Handle multiple checkboxes
                        const values = formData.getAll(field.code);
                        // Collect additional inputs for choices that have them
                        const additionalInputs = {};
                        values.forEach(code => {
                            const additionalKey = `${field.code}_additional_${code}`;
                            const additionalValue = formData.get(additionalKey);
                            if (additionalValue) {
                                additionalInputs[code] = additionalValue;
                            }
                        });
                        responseData[field.code] = {
                            label: field.label,
                            value: values,
                            additionalInputs: Object.keys(additionalInputs).length > 0 ? additionalInputs : null,
                            type: field.field_type
                        };
                    } else if (field.field_type === 'multiple_choice') {
                        // Handle multiple choice with potential additional input
                        const value = formData.get(field.code) || '';
                        // Collect additional input if exists
                        const additionalKey = `${field.code}_additional_${value}`;
                        const additionalValue = formData.get(additionalKey);
                        responseData[field.code] = {
                            label: field.label,
                            value: value,
                            additionalInputs: additionalValue ? { [value]: additionalValue } : null,
                            type: field.field_type
                        };
                    } else if (field.field_type === 'file') {
                        // Handle file (just store filename)
                        const file = formData.get(field.code);
                        responseData[field.code] = {
                            label: field.label,
                            value: file ? file.name : '',
                            type: field.field_type
                        };
                    } else {
                        responseData[field.code] = {
                            label: field.label,
                            value: formData.get(field.code) || '',
                            type: field.field_type
                        };
                    }
                });

                // Save to database
                await Forms.submitResponse(currentForm.id, responseData);

                // Store for export
                submittedData = responseData;

                // Show success
                document.getElementById('formContent').style.display = 'none';
                document.getElementById('successState').style.display = 'block';

            } catch (err) {
                console.error('Error submitting form:', err);
                Utils.showToast('Erreur lors de la soumission. Veuillez réessayer.', 'error');
            } finally {
                Utils.setButtonLoading(submitBtn, false);
            }
        });

        // Export handlers
        document.getElementById('downloadPdfBtn').addEventListener('click', () => {
            if (submittedData) {
                PDFExport.downloadPDF(submittedData, currentFields, currentForm.title);
            }
        });

        document.getElementById('downloadCsvBtn').addEventListener('click', () => {
            if (submittedData) {
                const csv = Export.generateCSV(submittedData, currentFields);
                Export.downloadCSV(csv, `${currentForm.title.replace(/[^a-z0-9]/gi, '_')}_reponse.csv`);
            }
        });

        document.getElementById('emailCsvBtn').addEventListener('click', () => {
            if (submittedData) {
                const csv = Export.generateCSV(submittedData, currentFields);
                Export.mailtoCSV(csv, currentForm.title);
            }
        });

        // Initialize
        init();
    </script>
</body>
</html>
