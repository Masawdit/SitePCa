<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créateur de Formulaires - Formulaires Disponibles</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <a href="index.html" class="header-logo">Créateur de Formulaires</a>
            <nav class="header-nav">
                <a href="login.html">Connexion Admin</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <div class="page-wrapper">
        <div class="container">
            <div class="text-center mb-4">
                <h1>Formulaires Disponibles</h1>
                <p class="text-muted">Sélectionnez un formulaire à remplir</p>
            </div>

            <!-- Loading state -->
            <div id="loadingState" class="text-center">
                <div class="spinner" style="margin: 2rem auto;"></div>
                <p class="text-muted">Chargement des formulaires...</p>
            </div>

            <!-- Empty state -->
            <div id="emptyState" class="card empty-state" style="display: none;">
                <div class="empty-state-icon">📋</div>
                <h3>Aucun formulaire disponible</h3>
                <p class="text-muted">Il n'y a pas de formulaires publiés pour le moment.</p>
            </div>

            <!-- Forms grid -->
            <div id="formsGrid" class="forms-grid"></div>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/forms.js"></script>

    <script>
        // Load and display forms
        async function init() {
            const loadingState = document.getElementById('loadingState');
            const emptyState = document.getElementById('emptyState');
            const formsGrid = document.getElementById('formsGrid');

            try {
                const forms = await Forms.loadPublishedForms();

                loadingState.style.display = 'none';

                if (forms.length === 0) {
                    emptyState.style.display = 'block';
                } else {
                    formsGrid.innerHTML = forms.map(form => `
                        <div class="form-card-public">
                            <h3>${Utils.escapeHtml(form.title)}</h3>
                            <p>${form.description ? Utils.escapeHtml(form.description) : 'Aucune description'}</p>
                            <a href="form.html?id=${form.id}" class="btn btn-primary">Remplir le formulaire</a>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error('Error loading forms:', err);
                loadingState.innerHTML = '<p class="text-danger">Erreur lors du chargement des formulaires. Veuillez réessayer.</p>';
            }
        }

        init();
    </script>
</body>
</html>
